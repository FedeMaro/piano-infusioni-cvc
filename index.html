<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="CVC"><meta name="theme-color" content="#0b5fa5">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="robots" content="noindex">
<style>
:root{--bg:#f5f7f9;--panel:#fff;--fg:#13222d;--muted:#4f5f6c;--line:#aebac4;--accent:#0b5fa5;--accent-fg:#fff;--no:#b42318;--no-bg:#fde3e0}
@media(prefers-color-scheme:dark){:root{--bg:#0e161d;--panel:#16222c;--fg:#e8eef3;--muted:#a3b3c0;--line:#44586a;--accent:#6db3ec;--accent-fg:#06202e;--no:#ff8a80;--no-bg:#43211f;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 18px;width:100%;max-width:380px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
label{display:block;font-size:14px;color:var(--muted);font-weight:500;margin-bottom:4px}
input[type=password],input[type=text]{width:100%;min-height:46px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px;margin-top:8px}
button{min-height:46px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-weight:600;padding:0 14px;cursor:pointer}
button.p{flex:1;background:var(--accent);color:var(--accent-fg);border-color:transparent}
button:disabled{opacity:.6}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;margin-top:12px;min-height:44px}.chk input{width:22px;height:22px;accent-color:var(--accent)}
.err{display:none;margin-top:12px;background:var(--no-bg);border:1px solid var(--no);border-radius:8px;padding:10px 12px;font-size:14px}
.foot{font-size:12px;color:var(--muted);margin-top:14px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style></head><body>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const $=s=>document.querySelector(s);
async function keyFromPw(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
async function open(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.data));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([pt]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close();}
async function tryStored(){try{const raw=localStorage.getItem('cvc_k');if(!raw)return false;const key=await crypto.subtle.importKey('raw',b64(raw),{name:'AES-GCM'},true,['decrypt']);await open(key);return true;}catch(e){try{localStorage.removeItem('cvc_k')}catch(_){}return false;}}
$('#show').onclick=()=>{const i=$('#pw');const t=i.type==='password';i.type=t?'text':'password';$('#show').textContent=t?'Nascondi':'Mostra';$('#show').setAttribute('aria-pressed',t);};
$('#f').onsubmit=async e=>{e.preventDefault();const b=$('#go'),err=$('#err');b.disabled=true;b.textContent='Apertura…';err.style.display='none';
 try{const key=await keyFromPw($('#pw').value);if($('#rem').checked){try{const raw=await crypto.subtle.exportKey('raw',key);localStorage.setItem('cvc_k',btoa(String.fromCharCode(...new Uint8Array(raw))));}catch(_){}}await open(key);}
 catch(e){err.textContent='Password non corretta. Riprova.';err.style.display='block';b.disabled=false;b.textContent='Apri';$('#pw').select();}};
if(!window.isSecureContext||!crypto.subtle){$('#err').textContent='Questo browser non supporta la cifratura richiesta. Usa Safari o Chrome aggiornati.';$('#err').style.display='block';}
else tryStored();
})();
